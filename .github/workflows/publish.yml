name: Test and publish add-on images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: [job_bot, ollama]
    steps:
      - uses: actions/checkout@v5
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.addon }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  # The slim Ollama image drops GPU backends; prove the CPU backend still runs a model, natively per arch
  ollama-smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?/\1/p' ollama/config.yaml)
          docker build --build-arg OLLAMA_VERSION="$version" -t ollama-slim ollama/
          docker image ls ollama-slim
      - name: Run a tiny model
        run: |
          docker run -d --name ollama -p 11434:11434 ollama-slim
          for i in $(seq 60); do curl -sf localhost:11434/api/version && break; sleep 1; done
          # the model download from the Ollama registry is the flaky part
          for i in 1 2 3; do docker exec ollama ollama pull qwen2.5:0.5b && break; sleep 10; done
          curl -sf --retry 3 --retry-all-errors --max-time 300 localhost:11434/api/generate \
            -d '{"model":"qwen2.5:0.5b","prompt":"Say hi","stream":false,"options":{"num_predict":8}}' \
            | tee /tmp/out.json
          grep -q '"response":"[^"]' /tmp/out.json
      - name: Logs
        if: always()
        run: docker logs ollama 2>&1 | tail -50

  build-job-bot:
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-image.yml
    with:
      addon: job_bot
      context: .
      image: ghcr.io/nea88/job_bot
    permissions:
      contents: read
      packages: write

  build-ollama:
    needs: [lint, ollama-smoke]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-image.yml
    with:
      addon: ollama
      context: ollama
      image: ghcr.io/nea88/job_bot-ollama
    permissions:
      contents: read
      packages: write
