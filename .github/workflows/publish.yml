name: Test and publish add-on image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: [job_bot, ollama]
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.addon }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  build:
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read add-on version
        id: version
        run: echo "version=$(sed -nE 's/^version:[[:space:]]*\"?([^\"]+)\"?/\1/p' job_bot/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/nea88/job_bot:${{ steps.version.outputs.version }}
            ghcr.io/nea88/job_bot:latest
          labels: |
            io.hass.type=addon
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/Nea88/job_bot
          cache-from: type=gha
          cache-to: type=gha,mode=max
