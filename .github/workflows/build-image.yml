name: Build add-on image

on:
  workflow_call:
    inputs:
      addon:
        required: true
        type: string
      context:
        required: true
        type: string
      image:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Read add-on version
        id: version
        run: echo "version=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?/\1/p' ${{ inputs.addon }}/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          platforms: linux/arm64,linux/amd64
          build-args: OLLAMA_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ${{ inputs.image }}:${{ steps.version.outputs.version }}
            ${{ inputs.image }}:latest
          labels: |
            io.hass.type=addon
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/Nea88/job_bot
          cache-from: type=gha,scope=${{ inputs.addon }}
          cache-to: type=gha,mode=max,scope=${{ inputs.addon }}
